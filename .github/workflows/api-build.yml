name: API Triggered Build

on:
  workflow_dispatch:
    inputs:
      zip_pass:
        description: 'Zip Password'
        required: true
      shell_script:
        description: 'Full Shell Script'
        required: true

permissions:
  contents: write

jobs:
  secure-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go (Latest)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Mask Secrets
        run: |
          SECRET_PASS=$(jq -r '.inputs.zip_pass' "$GITHUB_EVENT_PATH")
          echo "::add-mask::$SECRET_PASS"

      - name: Prepare Output Directory
        run: mkdir -p "$GITHUB_WORKSPACE/output"

      - name: Execute Dynamic Script
        env:
          ZIP_PASS: ${{ inputs.zip_pass }}
          RAW_SCRIPT: ${{ inputs.shell_script }}
          OUTPUT_DIR: ${{ github.workspace }}/output 
        run: |
          echo "🚀 Received dynamic script from API..."
          echo "$RAW_SCRIPT" > run_build.sh
          chmod +x run_build.sh
          
          echo "----------------------------------------"
          bash -e run_build.sh
          echo "----------------------------------------"

      - name: Upload to Temporary Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: temp-api-build
          name: "Temporary Build Artifacts"
          draft: false
          prerelease: true
          files: |
            output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
